<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlueTap Prototype</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef5ff;color:#10213a}button,input{font:inherit}.app{max-width:430px;margin:auto;min-height:100vh;background:#f7faff}.top{padding:28px 22px 18px;background:linear-gradient(135deg,#1479ff,#55b6ff);color:white;border-radius:0 0 28px 28px}.brand{font-weight:900;font-size:25px}.tag{opacity:.8;font-size:12px}.card{margin-top:20px;background:#ffffff18;border:1px solid #ffffff35;border-radius:22px;padding:20px}.label{font-size:12px;opacity:.8}.bal{font-size:37px;font-weight:850;margin:4px 0}.main{padding:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:16px;padding:15px;font-weight:750;cursor:pointer}.primary{background:#1479ff;color:#fff}.light{background:#e8f1ff;color:#1267d9}.panel{background:white;border-radius:20px;padding:18px;margin-top:18px;box-shadow:0 8px 30px #16477d12}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #edf1f7}.row:last-child{border:0}.green{color:#159447}.red{color:#d94141}.modal{position:fixed;inset:0;background:#09182b88;display:none;align-items:flex-end}.sheet{width:min(430px,100%);margin:auto;background:white;border-radius:25px 25px 0 0;padding:22px}.sheet h2{margin-top:0}.input{width:100%;padding:14px;border:1px solid #d8e1ee;border-radius:13px;margin:8px 0 14px}.close{float:right;background:#eef3fa;border:0;border-radius:50%;width:34px;height:34px}.notice{font-size:12px;color:#63738b;margin-top:14px;text-align:center}</style></head><body><div class="app"><header class="top"><div class="brand">💧 BlueTap</div><div class="tag">Demo wallet • fake money only</div><div class="card"><div class="label">Available balance</div><div class="bal" id="balance">$139.00</div><div class="label">Demo account · bluetap_user</div></div></header><main class="main"><div class="actions"><button class="btn primary" onclick="openModal('send')">💸 Send</button><button class="btn light" onclick="openModal('add')">＋ Add demo money</button></div><section class="panel"><b>Recent activity</b><div id="tx"><div class="row"><span>🎁 Welcome bonus</span><span class="green">+$139.00</span></div></div></section><section class="panel"><b>BlueTap ID</b><div class="row"><span>@bluetap_user</span><button class="btn light" onclick="copyId()">Copy</button></div></section><div class="notice">Prototype only — no real payments, cards, banks, or money are connected.</div></main></div><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="title">Send money</h2><div id="fields"></div></div></div><script>
let balance=139;const $=id=>document.getElementById(id);function render(){ $('balance').textContent='$'+balance.toFixed(2)}function openModal(type){$('modal').style.display='flex';if(type==='send'){$('title').textContent='Send demo money';$('fields').innerHTML='<input class="input" id="who" placeholder="Username e.g. @alex"><input class="input" id="amt" type="number" min="0.01" step="0.01" placeholder="Amount"><button class="btn primary" style="width:100%" onclick="send()">Send demo payment</button>'}else{$('title').textContent='Add demo money';$('fields').innerHTML='<input class="input" id="amt" type="number" min="1" step="1" placeholder="Amount"><button class="btn primary" style="width:100%" onclick="add()">Add to demo balance</button>'}}function closeModal(){$('modal').style.display='none'}function add(){let a=Number($('amt').value);if(!a||a<=0)return alert('Enter a valid amount');balance+=a;$('tx').insertAdjacentHTML('afterbegin',`<div class="row"><span>＋ Demo top-up</span><span class="green">+$${a.toFixed(2)}</span></div>`);render();closeModal()}function send(){let w=$('who').value.trim()||'@demo_user',a=Number($('amt').value);if(!a||a<=0)return alert('Enter a valid amount');if(a>balance)return alert('Insufficient demo balance');balance-=a;$('tx').insertAdjacentHTML('afterbegin',`<div class="row"><span>💸 To ${w}</span><span class="red">-$${a.toFixed(2)}</span></div>`);render();closeModal()}function copyId(){navigator.clipboard?.writeText('@bluetap_user');alert('BlueTap ID copied!')}render();</script></body></html>
